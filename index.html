<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KakaoTalk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      overflow: hidden;
    }

    /* 폰 프레임: PC에서는 목업, 모바일에서는 풀스크린 반응형 */
    .phone-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      height: 100dvh;
      max-height: 880px;
      background: #FFFFFF;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    @media (min-width: 500px) {
      .phone-container {
        border-radius: 40px;
        border: 10px solid #1f1f1f;
        height: 86vh;
      }
    }

    /* 1. 스플래시 화면 */
    .splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #FEE500;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .kakao-logo {
      width: 72px;
      height: 64px;
      background-color: #3C1E1E;
      border-radius: 30px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .kakao-logo::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 16px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 4px solid transparent;
      border-top: 14px solid #3C1E1E;
      transform: rotate(15deg);
    }

    .kakao-logo span {
      color: #FEE500;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -1px;
    }

    /* 2. 상태바 */
    .status-bar {
      height: 28px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      background: #FFFFFF;
      color: #000;
      z-index: 10;
    }

    .chat-view-active .status-bar {
      background: #ABC1D1;
    }

    /* 3. 화면 뷰 (채팅목록 / 채팅방) */
    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 28px;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 채팅 목록 화면 */
    #listView {
      z-index: 1;
    }

    .list-header {
      padding: 14px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #111;
    }

    .chat-items {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      gap: 14px;
      cursor: default;
    }

    .chat-item.clickable {
      cursor: pointer;
    }

    .chat-item.clickable:active {
      background-color: #f2f2f2;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 19px;
      background: #ddd;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #777;
      font-size: 15px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      color: #111;
    }

    .item-time {
      font-size: 11px;
      color: #999;
    }

    .item-preview {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4. 채팅방 화면 */
    #chatView {
      z-index: 2;
      background: #ABC1D1;
      transform: translateX(100%);
    }

    #chatView.active {
      transform: translateX(0);
    }

    .chat-header {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ABC1D1;
    }

    /* 뒤로가기 버튼 비활성화 */
    .back-btn {
      font-size: 20px;
      font-weight: 300;
      color: #333;
      cursor: default;
      pointer-events: none;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 700;
      color: #111;
    }

    .chat-messages {
      flex: 1;
      padding: 12px 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    /* 날짜 구분선 */
    .date-divider {
      align-self: center;
      background: rgba(0, 0, 0, 0.15);
      color: #fff;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 12px;
      margin: 10px 0 4px;
      letter-spacing: -0.2px;
    }

    /* 동적으로 생길 오늘 날짜 구분선 애니메이션 */
    .today-divider {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      display: none;
    }

    .today-divider.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* 메시지 열 */
    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .msg-row.dynamic {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      display: none;
    }

    .msg-row.dynamic.show {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .msg-row.incoming .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .msg-row.incoming .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-content-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }

    .sender-name {
      font-size: 11px;
      color: #444;
      margin-bottom: 4px;
    }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 5px;
    }

    .msg-bubble {
      padding: 8px 12px;
      font-size: 13.5px;
      line-height: 1.45;
      border-radius: 14px;
      word-break: break-all;
    }

    .incoming .msg-bubble {
      background: #FFFFFF;
      color: #111;
      border-top-left-radius: 2px;
    }

    .msg-row.outgoing {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .outgoing .bubble-row {
      flex-direction: row-reverse;
    }

    .outgoing .msg-bubble {
      background: #FEE500;
      color: #111;
      border-top-right-radius: 2px;
    }

    .msg-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    .outgoing .msg-meta {
      align-items: flex-end;
    }

    .unread {
      font-size: 10px;
      color: #FEE500;
      font-weight: 700;
      line-height: 1;
      transition: opacity 0.2s ease;
    }

    .unread.hidden {
      visibility: hidden;
    }
